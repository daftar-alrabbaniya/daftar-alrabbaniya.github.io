.date{color:var(--sage);font-size:14px;line-height:1.5;text-align:center;font-weight:500}
.hero{position:relative;text-align:center;padding:18px 0 6px}
.hero h1.titleimg{margin:0;line-height:0}
.titleimg svg{display:block;width:min(280px,58vw);height:auto;margin:0 auto}
.tag{margin:14px 0 18px;display:flex;justify-content:center}
.hl{position:relative;display:inline-block;background:var(--roseL);color:var(--ink);padding:0 12px;font-weight:700;line-height:1.5;font-size:15px}
.hl::before,.hl::after{content:"";position:absolute;width:2px;height:calc(100% + 4px);background:var(--rose)}
.hl::before{right:-1px;top:-2px}.hl::after{left:-1px;bottom:-2px}
.hl i{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--rose)}
.hl i:first-child{right:-4px;top:-7px}.hl i:last-child{left:-4px;bottom:-7px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,36px);box-shadow:0 24px 50px -24px rgba(110,70,60,.35);margin-bottom:22px}
.center{text-align:center}
.lvl{display:inline-block;font-size:14px;font-weight:700;color:var(--sageD);background:var(--sageL);padding:3px 12px;border-radius:999px;margin:0 0 10px}
h2{font:800 24px/1.4 Tajawal,sans-serif;margin:0 0 6px}
.muted{color:var(--muted)}
.field{width:100%;max-width:420px;font:500 18px Tajawal,sans-serif;padding:12px 18px;border-radius:999px;border:1.5px dashed var(--rose);background:light-dark(rgba(255,255,255,.7),rgba(255,255,255,.05));color:var(--ink);text-align:center}
.field:focus{outline:none;border-style:solid}
.btn{font:800 17px Tajawal,sans-serif;min-height:50px;padding:10px 28px;border-radius:999px;border:0;cursor:pointer;background:var(--rose);color:#fff;box-shadow:0 8px 18px -8px var(--rose)}
.btn:focus-visible,.chip:focus-visible,.sm:focus-visible{outline:3px solid var(--sage);outline-offset:3px}
#start{display:grid;gap:16px;justify-items:center}
/* toolbar */
.tools{position:sticky;top:12px;z-index:10;margin:26px 0 28px;padding:14px 16px 12px;border-radius:22px;color:#fbf3ea;
  background-color:#c4686c;background-image:var(--linen),radial-gradient(120% 140% at 15% 0%,rgba(255,255,255,.16),transparent 55%),linear-gradient(160deg,#cf777a,#b85d62);
  box-shadow:0 22px 40px -22px rgba(120,45,50,.6),0 2px 0 rgba(255,255,255,.18) inset}
.tools::after{content:"";position:absolute;inset:6px;border:1px dashed rgba(255,243,235,.45);border-radius:17px;pointer-events:none}
.th{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;margin:0 4px 9px;font:800 13.5px Tajawal,sans-serif}
.th .ttl{display:inline-flex;align-items:center;gap:7px}
.th .ttl i{width:6px;height:6px;border-radius:50%;background:#fbf3ea;box-shadow:0 0 0 3px rgba(251,243,234,.25)}
.prog{font:700 12px Tajawal,sans-serif;color:#fff;background:rgba(255,245,238,.18);border:1px solid rgba(255,245,238,.35);padding:1px 10px;border-radius:999px;white-space:nowrap}
.prog:empty{display:none}
.srch{position:relative;z-index:1;display:flex;align-items:center}
.srch svg{position:absolute;right:14px;width:19px;height:19px;color:#c4686c;pointer-events:none}
.srch input{flex:1;font:600 16px Tajawal,sans-serif;padding:11px 44px 11px 14px;border-radius:14px;border:0;background:#fbf7f0;background-image:var(--grain);color:#38472f;box-shadow:inset 0 1px 3px rgba(90,40,40,.18),0 1px 0 rgba(255,255,255,.25)}
.srch input::placeholder{color:#b49c98;font-weight:500}
.srch input:focus{outline:none;box-shadow:inset 0 1px 3px rgba(90,40,40,.18),0 0 0 3px rgba(251,243,234,.55)}
.srch input::-webkit-search-cancel-button{filter:hue-rotate(300deg)}
.chips{position:relative;z-index:1;display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:700 13.5px Tajawal,sans-serif;padding:4px 13px;border-radius:10px;border:1.5px dashed rgba(255,243,235,.6);background:transparent;color:#fff;cursor:pointer;transition:background .2s,color .2s}
.chip.on{background:#fbf3ea;color:#b85d62;border-style:solid;border-color:#fbf3ea}
.chip:focus-visible{outline:2px solid #fbf3ea;outline-offset:2px}
/* book */
.book{text-align:center;margin:34px 0 18px}
.book small{display:block;color:var(--sageD);font-weight:800;font-size:15px}
.book h2{font:800 clamp(26px,6.4vw,34px)/1.35 Tajawal,sans-serif;color:var(--rose);margin:0}
.item{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px clamp(16px,4vw,26px) 16px;margin:0 0 16px;box-shadow:0 18px 36px -26px rgba(110,70,60,.4)}
.item.hide{display:none}
.ih{display:flex;align-items:baseline;gap:12px;justify-content:space-between}
.ih h3{margin:0;font:800 clamp(18px,4.4vw,21px)/1.6 Tajawal,sans-serif;text-wrap:pretty}
.pg{flex:none;font-size:13px;font-weight:700;color:var(--sageD);background:var(--sageL);padding:2px 10px;border-radius:999px;white-space:nowrap}
.note{position:relative;border:1.5px solid var(--rose);border-radius:16px;background:light-dark(rgba(252,232,232,.45),rgba(53,38,40,.5));padding:24px 14px 10px;margin:22px 0 8px}
.note::after{content:"";position:absolute;inset:5px;border:1px dashed color-mix(in srgb,var(--rose) 45%,transparent);border-radius:11px;pointer-events:none}
.note label{position:absolute;top:-14px;right:16px;background:var(--rose);color:#fff;font-weight:800;font-size:13.5px;padding:3px 14px;border-radius:999px;box-shadow:0 0 0 4px light-dark(rgba(253,251,246,.85),rgba(39,35,31,.85));white-space:nowrap}
.note textarea{position:relative;z-index:1;display:block;width:100%;min-height:93px;resize:none;overflow:hidden;border:0;color:var(--ink);font:500 17px/31px Tajawal,sans-serif;padding:0 4px;background:repeating-linear-gradient(transparent 0 30px,color-mix(in srgb,var(--rose) 28%,transparent) 30px 31px);background-attachment:local}
.note textarea:focus{outline:none}
.note textarea::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent)}
.foot2{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:30px}
.st{font-size:13px;font-weight:700;color:var(--sage)}
.sm{font:700 13.5px Tajawal,sans-serif;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:1.5px solid var(--sage);background:transparent;color:var(--sageD);cursor:pointer}
.sm svg{width:16px;height:16px}
.has .ih h3::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rose);margin-inline-end:8px;vertical-align:middle}
.empty{text-align:center;color:var(--muted);padding:30px 0}

/* ---------- paper & linen textures ---------- */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:var(--grain);opacity:.55;mix-blend-mode:multiply}
.wrap{position:relative;z-index:1}
.item,.card{background-image:var(--grain);background-color:var(--card)}
/* ---------- cover ---------- */
body.closed .foot{display:none}
.bar,.hero{display:none}
.stage{min-height:100svh;display:grid;place-items:center;padding:5vh 0 4vh;overflow:hidden;width:100vw;margin-inline:calc(50% - 50vw);position:relative}
html{overflow-x:hidden}
.nbw{display:grid;justify-items:center;gap:26px;transition:opacity .8s ease,transform 1s cubic-bezier(.4,0,.2,1),filter .8s ease}
.nbw.leave{opacity:0;transform:scale(1.06) translateY(-8px);filter:blur(6px)}
.nb{position:relative;width:min(310px,78vw);aspect-ratio:5/7;perspective:2200px;transition:transform 1.4s cubic-bezier(.65,0,.35,1)}
.nb.open{transform:translateX(-50%)}

.nb .block{position:absolute;inset:5px 6px 2px 3px;border-radius:4px 12px 12px 4px;background:#f6f0e6;background-image:var(--grain),repeating-linear-gradient(90deg,transparent 0 2px,rgba(90,70,60,.07) 2px 3px);

  /* fade cards as they slide under the search bar and behind the save button */
  let fq=0;const fade=()=>{fq=0;const tb=$('.tools').getBoundingClientRect().bottom-6,lb=$('#lq'),bl=(lb&&!lb.hidden)?lb.getBoundingClientRect().top-10:innerHeight-6;
    vis.forEach(e=>{const r=e.getBoundingClientRect(),ct=Math.max(0,tb-r.top),cb=Math.max(0,r.bottom-bl);
      if(ct>0||cb>0){e.style.setProperty('--ct',ct+'px');e.style.setProperty('--cb',cb+'px');e.classList.add('fz')}else e.classList.remove('fz')})};
  const fadeEls=[...document.querySelectorAll('#main .item,#main .book,#main .actions')],vis=new Set();
  const vio=new IntersectionObserver(es=>{es.forEach(en=>en.isIntersecting?vis.add(en.target):(vis.delete(en.target),en.target.classList.remove('fz')));fade()});
  fadeEls.forEach(e=>vio.observe(e));
  addEventListener('scroll',()=>{if(!fq)fq=requestAnimationFrame(fade)},{passive:true});addEventListener('resize',fade);setTimeout(fade,100);

  /* highlight the chip of the book in view */
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){const b=en.target.dataset.b;document.querySelectorAll('.chip').forEach(c=>{const on=c.dataset.b===b;if(on&&!c.classList.contains('on')){const bar=c.parentElement;bar.scrollTo({left:c.offsetLeft-bar.clientWidth/2+c.clientWidth/2,behavior:'smooth'})}c.classList.toggle('on',on)})}}),{rootMargin:'-45% 0px -50% 0px'});
  document.querySelectorAll('.item').forEach(i=>io.observe(i));
}

const norm=s=>s.replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim();
function filter(q){
  q=norm(q);let shown=0;
  ITEMS.forEach(x=>{const ok=!q||norm(x.t).includes(q)||String(x.p)===q;document.getElementById('i'+x.id).classList.toggle('hide',!ok);if(ok)shown++});
  DATA.forEach((_,b)=>{document.getElementById('b'+b).style.display=ITEMS.some(x=>x.b===b&&!document.getElementById('i'+x.id).classList.contains('hide'))?'':'none'});
  $('#none').hidden=shown>0;
}
function makePDF(only){
  const one=Array.isArray(only),set=one?new Set(only):null;
  if(!one&&!Object.values(notes).some(v=>v.trim())){toast('ما كتبتِ شرح بعد');return}
  const day=new Date().toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'});
  const nm=CUR;
  const T=document.querySelector('.titleimg').outerHTML;
  const cover=()=>`<section class="pc"><div class="logo"></div><p class="kick">دفتر شرح</p>${T}
    <div class="tag"><span class="hl"><i></i>د. مشعل عبدالعزيز الفلاحي<i></i></span></div><div class="rule"></div>
    <p class="by">شرح أستاذة سمر الصالح</p>${nm?`<p class="who">دفتر ${esc(nm)}</p>`:''}${one?`<p class="lqd">لقاء ${day}</p>`:''}
    <p class="cfoot">الكتاب: د. مشعل عبدالعزيز الفلاحي – دار القلم<b>© شرح كتاب: الطريق إلى الربانية – أستاذة سمر الصالح ٢٠٢٦</b></p></section>`;
  let h='<div class="pbg"></div>'+cover()+'<div class="pp">',lastB=-1;
  ITEMS.forEach(x=>{const v=(notes[x.id]||'').trim();if(!v||(one&&!set.has(x.id)))return;
    if(x.b!==lastB){h+=`<div class="bh"><b>${x.book||'المقدمة'}</b><span>الطريق إلى الربانية</span></div>`;lastB=x.b}
    h+=`<section class="pi"><div class="ih"><h3>${esc(x.t)}</h3><span class="pg">ص ${AR(x.p)}</span></div><div class="note"><label>شرح الأستاذة سمر الصالح</label><div class="nt">${esc(v)}</div></div></section>`});
  h+='</div>';
  $('#print').innerHTML=h;
  const old=document.title;document.title=one?('شرح لقاء '+day+' – الطريق إلى الربانية'):('شرح الطريق إلى الربانية'+(nm?' – '+nm:''));
  const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios)toast('في الصفحة الجاية: اضغطي أيقونة المشاركة ⬆︎ ثم «حفظ في الملفات»');
  setTimeout(()=>{
    const y=scrollY,pr=$('#print'),out=[...document.body.children].filter(e=>e!==pr&&e.tagName!=='SCRIPT');
    const ph=document.createComment('p');out.forEach(e=>{e.__ph=document.createComment('');e.replaceWith(e.__ph)});
    pr.style.display='block';let done=false;
    const back=()=>{if(done)return;done=true;out.forEach(e=>e.__ph.replaceWith(e));pr.style.display='';document.title=old;scrollTo(0,y);removeEventListener('afterprint',back);removeEventListener('pointerdown',back,true);removeEventListener('touchstart',back,true)};
    if(!ios)addEventListener('afterprint',back);
    window.print();
    setTimeout(()=>{addEventListener('pointerdown',back,true);addEventListener('touchstart',back,true)},800);
  },ios?2200:300);
}
start();
}
</script>
